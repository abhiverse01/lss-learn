<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:Arial;display:flex;justify-content:center;padding:60px}
  .box{width:300px}
  input{width:100%;padding:8px;box-sizing:border-box}
  ul{list-style:none;padding:0;font-size:13px}
  li{margin:4px 0;color:#c53030}
  li.ok{color:#2f855a}
  .bar{height:8px;border-radius:4px;background:#eee;margin-top:8px}
  .fill{height:100%;border-radius:4px;width:0;transition:.3s;background:#c53030}
  #label{font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="box">
  <h3>Password Strength</h3>
  <input id="pw" type="password" placeholder="Enter password">
  <button onclick="toggle()">Show/Hide</button>
  <ul id="checks">
    <li id="len">At least 8 characters</li>
    <li id="up">One uppercase letter</li>
    <li id="low">One lowercase letter</li>
    <li id="num">One number</li>
    <li id="sp">One special character</li>
  </ul>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="label"></div>
</div>
<script>
  const pw = document.getElementById('pw');
  function toggle(){ pw.type = pw.type === 'password' ? 'text' : 'password'; }
  pw.addEventListener('input', () => {
    const v = pw.value;
    const rules = {
      len: v.length >= 8,
      up: /[A-Z]/.test(v),
      low: /[a-z]/.test(v),
      num: /[0-9]/.test(v),
      sp: /[^A-Za-z0-9]/.test(v)
    };
    let score = 0;
    for(const key in rules){
      document.getElementById(key).classList.toggle('ok', rules[key]);
      if(rules[key]) score++;
    }
    const fill = document.getElementById('fill');
    const label = document.getElementById('label');
    const pct = (score / 5) * 100;
    fill.style.width = pct + '%';
    if(score <= 2){ fill.style.background = '#c53030'; label.textContent = 'Weak'; }
    else if(score <= 4){ fill.style.background = '#dd6b20'; label.textContent = 'Medium'; }
    else { fill.style.background = '#2f855a'; label.textContent = 'Strong'; }
  });
</script>
</body>
</html>
