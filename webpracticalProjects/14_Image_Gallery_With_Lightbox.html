<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:Arial;padding:30px;max-width:600px;margin:auto}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid img{width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:pointer}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
           align-items:center;justify-content:center;flex-direction:column}
  .overlay.show{display:flex}
  .overlay img{max-width:80%;max-height:70vh;border-radius:6px}
  .overlay button{margin-top:16px;padding:8px 16px;border:none;border-radius:6px;cursor:pointer}
  .close{position:absolute;top:20px;right:30px;color:#fff;font-size:24px;cursor:pointer}
</style>
</head>
<body>
<h2>Gallery</h2>
<div class="grid" id="grid"></div>
<div class="overlay" id="overlay">
  <span class="close" onclick="close_()">&times;</span>
  <img id="big">
  <div>
    <button onclick="nav(-1)">Prev</button>
    <button onclick="nav(1)">Next</button>
  </div>
</div>
<script>
  // Replace these with your own image paths/URLs.
  const urls = Array.from({length:8}, (_,i) => `img${i+1}.jpg`);
  let current = 0;
  const grid = document.getElementById('grid');
  urls.forEach((u,i) => {
    const img = document.createElement('img');
    img.src = u;
    img.onclick = () => open_(i);
    grid.appendChild(img);
  });
  function open_(i){
    current = i;
    document.getElementById('big').src = urls[i];
    document.getElementById('overlay').classList.add('show');
  }
  function close_(){ document.getElementById('overlay').classList.remove('show'); }
  function nav(dir){
    current = (current + dir + urls.length) % urls.length;
    document.getElementById('big').src = urls[current];
  }
  document.getElementById('overlay').addEventListener('click', e => {
    if(e.target.id === 'overlay') close_();
  });
</script>
</body>
</html>
