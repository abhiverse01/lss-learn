
<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:Arial,sans-serif;background:#e9edf2;display:flex;justify-content:center;padding:40px}
  .card{width:320px;background:#fff;border-radius:12px;box-shadow:0 8px 20px 
rgba(0,0,0,.15);overflow:hidden;border:1px solid #ccc}
  .header{background:#2b6cb0;color:#fff;padding:14px;text-align:center;font-weight:bold}
  .photo{width:80px;height:80px;border-radius:50%;background:#2b6cb0;color:#fff;
         display:flex;align-items:center;justify-content:center;font-size:28px;margin:16px auto}
  .field{display:flex;justify-content:space-between;padding:4px 20px;font-size:14px}
  .field span:first-child{color:#666}
  .sign{margin:20px;border-top:1px solid #999;text-align:center;padding-top:4px;font-size:12px;color:#666}
</style>
</head>
<body>
<div class="card">
  <div class="header">GREENFIELD INSTITUTE</div>
  <div class="photo">AS</div>
  <div class="field"><span>Name</span><span>Aditi Sharma</span></div>
  <div class="field"><span>ID No.</span><span>GI-2026-0142</span></div>
  <div class="field"><span>DOB</span><span>01 Jan 2000</span></div>
  <div class="field"><span>Blood Group</span><span>O+</span></div>
  <div class="field"><span>Address</span><span>Kathmandu, NP</span></div>
  <div class="field"><span>Valid Till</span><span>Dec 2027</span></div>
  <div class="sign">Authorized Signature</div>
</div>
</body>
</html>
