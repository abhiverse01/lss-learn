<!DOCTYPE html>
<html>
<head>
<style>
  :root{--bg:#fff;--text:#111}
  body.dark{--bg:#1a1a2e;--text:#f0f0f0}
  body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);
       display:flex;justify-content:center;align-items:center;height:100vh;margin:0;transition:.4s}
  .card{border:1px solid #888;border-radius:14px;padding:30px;width:260px;text-align:center;transition:.4s}
  .links{display:flex;justify-content:center;gap:14px;margin-top:14px}
  .links a{color:inherit;text-decoration:none;font-size:14px}
  button{margin-top:18px;padding:8px 16px;border:none;border-radius:
6px;background:#2b6cb0;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h2>Aditi Sharma</h2>
  <p>Frontend Developer</p>
  <p style="font-size:13px">Builds clean, fast web experiences.</p>
  <div class="links">
    <a href="mailto:hi@example.com" target="_blank">Email</a>
    <a href="https://github.com" target="_blank">GitHub</a>
    <a href="https://linkedin.com" target="_blank">LinkedIn</a>
  </div>
  <button onclick="document.body.classList.toggle('dark')">Toggle Theme</button>
</div>
</body>
</html>
