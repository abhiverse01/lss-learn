
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LSS Learn — Code Archive</title>
<meta name="description" content="A browsable archive of HTML, CSS, JavaScript lessons, games and mini-projects for LSS High School Class 11 & 12." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E%3C/%3E%3C/text%3E%3C/svg%3E" />
<style>
  /* ============ TOKENS ============ */
  :root{
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", monospace;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;

    --bar-h: 54px;
    --explorer-w: 296px;

    --shadow-1: 0 1px 2px oklch(0% 0 0 / 0.3), 0 8px 24px oklch(0% 0 0 / 0.28);
    --shadow-2: 0 2px 6px oklch(0% 0 0 / 0.35), 0 16px 40px oklch(0% 0 0 / 0.35);

    --ease: cubic-bezier(.2,.7,.2,1);
  }

  :root[data-theme="dark"]{
    --bg: oklch(14.5% 0.020 260);
    --bg-elevated: oklch(17.5% 0.022 260);
    --surface: oklch(19.5% 0.023 260);
    --surface-hover: oklch(24% 0.026 260);
    --surface-active: oklch(27% 0.03 262);
    --border: oklch(28% 0.022 260);
    --border-strong: oklch(35% 0.024 260);
    --text: oklch(93% 0.01 260);
    --text-muted: oklch(68% 0.02 260);
    --text-faint: oklch(48% 0.02 260);
    --accent: oklch(70% 0.17 264);
    --accent-strong: oklch(76% 0.16 264);
    --accent-text: oklch(15% 0.02 264);
    --accent-soft: oklch(70% 0.17 264 / 0.14);
    --accent-soft-2: oklch(70% 0.17 264 / 0.28);
    --danger: oklch(65% 0.19 25);
    --code-bg: oklch(12% 0.016 260);

    --c-html: oklch(72% 0.15 44);
    --c-css:  oklch(70% 0.14 245);
    --c-js:   oklch(84% 0.15 95);
    --c-pdf:  oklch(66% 0.18 25);
    --c-md:   oklch(72% 0.01 260);
    --c-json: oklch(76% 0.13 148);
    --c-txt:  oklch(65% 0.01 260);
    --c-file: oklch(65% 0.01 260);
    --c-folder: oklch(79% 0.12 78);
  }

  :root[data-theme="light"]{
    --bg: oklch(98% 0.004 260);
    --bg-elevated: oklch(100% 0 0);
    --surface: oklch(100% 0 0);
    --surface-hover: oklch(95.5% 0.006 260);
    --surface-active: oklch(92% 0.012 262);
    --border: oklch(90% 0.006 260);
    --border-strong: oklch(82% 0.01 260);
    --text: oklch(21% 0.015 260);
    --text-muted: oklch(46% 0.02 260);
    --text-faint: oklch(63% 0.015 260);
    --accent: oklch(53% 0.19 264);
    --accent-strong: oklch(47% 0.19 264);
    --accent-text: oklch(99% 0 0);
    --accent-soft: oklch(53% 0.19 264 / 0.09);
    --accent-soft-2: oklch(53% 0.19 264 / 0.18);
    --danger: oklch(55% 0.19 25);
    --code-bg: oklch(97% 0.006 260);

    --c-html: oklch(56% 0.16 44);
    --c-css:  oklch(54% 0.15 245);
    --c-js:   oklch(58% 0.14 95);
    --c-pdf:  oklch(54% 0.19 25);
    --c-md:   oklch(48% 0.012 260);
    --c-json: oklch(52% 0.13 148);
    --c-txt:  oklch(50% 0.01 260);
    --c-file: oklch(50% 0.01 260);
    --c-folder: oklch(58% 0.13 78);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{ background:var(--accent-soft-2); }
  a{ color:inherit; }
  button{ font:inherit; color:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); background-clip:padding-box; }
  * { scrollbar-color: var(--border-strong) transparent; scrollbar-width: thin; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  svg{ display:block; }

  /* ============ APP SHELL ============ */
  #app{ height:100dvh; display:flex; flex-direction:column; }

  .titlebar{
    height:var(--bar-h); flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:0 16px; background:var(--bg-elevated); border-bottom:1px solid var(--border); z-index:40;
  }
  .titlebar .dots{ display:flex; gap:6px; margin-right:2px; }
  .titlebar .dots span{ width:11px; height:11px; border-radius:50%; display:block; }
  .titlebar .dots span:nth-child(1){ background:oklch(68% 0.19 25); }
  .titlebar .dots span:nth-child(2){ background:oklch(80% 0.15 85); }
  .titlebar .dots span:nth-child(3){ background:oklch(75% 0.16 148); }

  .brand{ display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; padding:2px 4px; border-radius:var(--radius-sm); }
  .brand:hover{ background:var(--surface-hover); }
  .brand .mark{ width:24px; height:24px; border-radius:7px; background:var(--accent); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:800; font-size:12px; flex:0 0 auto; }
  .brand .word{ font-family:var(--font-mono); font-weight:700; font-size:14px; letter-spacing:0.02em; white-space:nowrap; }
  .brand .word .cursor{ display:inline-block; width:7px; height:14px; background:var(--accent); margin-left:2px; vertical-align:-2px; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .breadcrumb{
    font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted);
    display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap;
    padding:5px 10px; border:1px solid var(--border); border-radius:999px; background:var(--surface);
    flex:1 1 auto; min-width:0;
  }
  .breadcrumb .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .breadcrumb .bpath{ overflow:hidden; text-overflow:ellipsis; }
  .breadcrumb.is-empty{ color:var(--text-faint); }

  .titlebar-right{ display:flex; align-items:center; gap:8px; margin-left:auto; flex:0 0 auto; }

  .searchwrap{ position:relative; display:flex; align-items:center; }
  .searchwrap svg{ position:absolute; left:10px; color:var(--text-faint); pointer-events:none; }
  #search{
    width:210px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:999px; padding:7px 34px 7px 32px; font-size:13px; font-family:var(--font-sans);
    transition:border-color .15s var(--ease), width .2s var(--ease), background .15s;
  }
  #search::placeholder{ color:var(--text-faint); }
  #search:focus{ border-color:var(--accent); width:250px; background:var(--bg-elevated); }
  .kbd{
    position:absolute; right:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
    border:1px solid var(--border); padding:1px 5px; border-radius:5px; background:var(--bg-elevated); pointer-events:none;
  }

  .iconbtn{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    cursor:pointer; transition:background .15s, border-color .15s, transform .1s;
  }
  .iconbtn:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
  .iconbtn:active{ transform:scale(0.94); }
  .menu-toggle{ display:none; }

  /* ============ SHELL / EXPLORER ============ */
  .shell{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

  .scrim{ display:none; }

  .explorer{
    width:var(--explorer-w); flex:0 0 auto; background:var(--bg-elevated); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  .explorer-head{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; color:var(--text-faint);
  }
  .explorer-head .stats-pill{
    font-family:var(--font-sans); font-size:11px; color:var(--text-muted); background:var(--surface);
    border:1px solid var(--border); padding:2px 8px; border-radius:999px;
  }
  #tree-scroll{ flex:1 1 auto; overflow-y:auto; padding:2px 8px 16px; }
  ul.tree, ul.children{ list-style:none; margin:0; padding:0; }
  ul.children{ overflow:hidden; }
  li.node.dir > ul.children{ display:block; }
  li.node.dir:not(.open) > ul.children{ display:none; }

  .row{
    display:flex; align-items:center; gap:7px; padding:6px 8px 6px calc(8px + var(--depth) * 16px);
    border-radius:7px; cursor:pointer; user-select:none; position:relative;
    color:var(--text); font-size:13px;
  }
  .row:hover{ background:var(--surface-hover); }
  .row .chev{ width:14px; height:14px; flex:0 0 auto; color:var(--text-faint); transition:transform .16s var(--ease); }
  .row .chev.spacer{ visibility:hidden; }
  li.node.dir.open > .row .chev{ transform:rotate(90deg); }
  .row .icon{ width:16px; height:16px; flex:0 0 auto; display:flex; }
  .row .label{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .count{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); background:var(--bg); border:1px solid var(--border); padding:0px 6px; border-radius:999px; flex:0 0 auto; }
  .row .size{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); flex:0 0 auto; }
  li.node.file.active > .row{ background:var(--accent-soft-2); }
  li.node.file.active > .row::before{
    content:""; position:absolute; left:0; top:4px; bottom:4px; width:3px; border-radius:3px; background:var(--accent);
  }
  li.node.file.active > .row .label{ color:var(--text); font-weight:600; }

  .tree-empty{ padding:24px 12px; text-align:center; color:var(--text-faint); font-size:13px; }
  .tree-empty svg{ margin:0 auto 10px; opacity:.6; }

  /* ============ STAGE ============ */
  .stage{ flex:1 1 auto; min-width:0; overflow-y:auto; position:relative; background:var(--bg); }

  /* ---- Dashboard ---- */
  #dashboard{ max-width:1040px; margin:0 auto; padding:56px 32px 80px; }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.12em; color:var(--accent);
    text-transform:uppercase; display:flex; align-items:center; gap:8px; margin-bottom:16px;
  }
  .eyebrow::before{ content:""; width:18px; height:1px; background:var(--accent); }
  h1.hero-title{
    font-size:clamp(28px, 4.4vw, 44px); line-height:1.12; letter-spacing:-0.02em; margin:0 0 16px; font-weight:700;
    max-width:16ch;
  }
  .hero-sub{ font-size:15.5px; line-height:1.6; color:var(--text-muted); max-width:56ch; margin:0 0 30px; }

  .stat-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:40px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; }
  .stat-tile .num{ font-family:var(--font-mono); font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .stat-tile .lbl{ font-size:12px; color:var(--text-faint); margin-top:2px; }

  .section-label{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin:0 0 14px; font-family:var(--font-mono); }

  .card-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:44px; }
  .launch-card{
    text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px; cursor:pointer; position:relative; overflow:hidden;
    transition:border-color .15s var(--ease), transform .15s var(--ease), background .15s;
  }
  .launch-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--bar); }
  .launch-card:hover{ border-color:var(--border-strong); background:var(--surface-hover); transform:translateY(-2px); }
  .launch-card .lc-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .launch-card .lc-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--tint); color:var(--bar); }
  .launch-card .lc-count{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
  .launch-card .lc-title{ font-weight:650; font-size:14.5px; margin-bottom:4px; }
  .launch-card .lc-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }

  .legend{ display:flex; flex-wrap:wrap; gap:16px 22px; padding:16px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:8px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }

  footer.credit{ margin-top:48px; padding-top:20px; border-top:1px solid var(--border); font-size:12px; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  footer.credit a{ color:var(--text-muted); text-decoration:none; }
  footer.credit a:hover{ color:var(--accent); }

  /* ---- Viewer ---- */
  #viewer{ height:100%; display:flex; flex-direction:column; }
  .viewer-bar{
    flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--bg-elevated); border-bottom:1px solid var(--border);
  }
  .viewer-bar .vb-dots{ display:flex; gap:6px; }
  .viewer-bar .vb-dots span{ width:10px; height:10px; border-radius:50%; }
  .viewer-bar .vb-dots span:nth-child(1){ background:oklch(68% 0.19 25 / .55); }
  .viewer-bar .vb-dots span:nth-child(2){ background:oklch(80% 0.15 85 / .55); }
  .viewer-bar .vb-dots span:nth-child(3){ background:oklch(75% 0.16 148 / .55); }
  .addr{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-family:var(--font-mono); font-size:12.5px;
  }
  .addr .adot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .addr .apath{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); }
  .addr .abytes{ margin-left:auto; color:var(--text-faint); flex:0 0 auto; }
  .vb-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .btn{
    display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); font-size:12.5px; font-weight:550; cursor:pointer; white-space:nowrap;
    transition:background .15s, border-color .15s, transform .1s; text-decoration:none;
  }
  .btn:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
  .btn:active{ transform:scale(0.96); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn svg{ width:14px; height:14px; }

  .viewer-body{ flex:1 1 auto; min-height:0; position:relative; background:var(--code-bg); }
  iframe.frame{ width:100%; height:100%; border:0; display:block; background:#fff; }

  .code-wrap{ height:100%; overflow:auto; }
  .code{ font-family:var(--font-mono); font-size:12.8px; line-height:1.65; padding:16px 0 40px; min-width:max-content; }
  .code .line{ display:flex; }
  .code .ln{ flex:0 0 auto; width:52px; text-align:right; padding-right:16px; color:var(--text-faint); user-select:none; }
  .code .lc{ white-space:pre; padding-right:24px; color:var(--text); }
  .tok-k{ color:var(--c-css); font-weight:600; }
  .tok-s{ color:var(--c-html); }
  .tok-c{ color:var(--text-faint); font-style:italic; }
  .tok-n{ color:var(--c-json); }

  .state-msg{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-faint); font-size:13px; text-align:center; padding:24px; }
  .state-msg svg{ opacity:.5; }
  .spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border-strong); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px); opacity:0; pointer-events:none;
    background:var(--surface); border:1px solid var(--border-strong); color:var(--text); padding:9px 16px; border-radius:999px;
    font-size:12.5px; box-shadow:var(--shadow-1); display:flex; align-items:center; gap:8px; z-index:200;
    transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg{ width:14px; height:14px; color:var(--accent); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 880px){
    .breadcrumb{ display:none; }
    .menu-toggle{ display:flex; }
    .searchwrap #search{ width:130px; }
    .searchwrap #search:focus{ width:150px; }
    .kbd{ display:none; }
    .explorer{
      position:fixed; top:var(--bar-h); left:0; bottom:0; z-index:60; width:min(84vw, 320px);
      transform:translateX(-100%); transition:transform .22s var(--ease); box-shadow:var(--shadow-2);
    }
    .explorer.open{ transform:translateX(0); }
    .scrim.open{ display:block; position:fixed; inset:var(--bar-h) 0 0 0; background:oklch(0% 0 0 / 0.45); z-index:55; }
    #dashboard{ padding:32px 18px 60px; }
    .stat-row{ grid-template-columns:repeat(2, 1fr); }
    .card-grid{ grid-template-columns:1fr; }
    .viewer-bar{ flex-wrap:wrap; }
    .addr{ order:3; width:100%; }
    .vb-actions .btn span.txt{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="titlebar">
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Toggle file explorer" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="brand" id="brandHome" aria-label="Back to homepage">
      <span class="mark">&lt;/&gt;</span>
      <span class="word">LSS_LEARN<span class="cursor" aria-hidden="true"></span></span>
    </button>
    <div class="breadcrumb is-empty" id="breadcrumb"><span class="bpath">no file open — browse the tree on the left</span></div>
    <div class="titlebar-right">
      <div class="searchwrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search files…" autocomplete="off" spellcheck="false" />
        <span class="kbd">/</span>
      </div>
      <button class="iconbtn" id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="shell">
    <div class="scrim" id="scrim"></div>

    <aside class="explorer" id="explorer" aria-label="File explorer">
      <div class="explorer-head">
        <span>EXPLORER</span>
        <span class="stats-pill" id="explorerCount">— files</span>
      </div>
      <div id="tree-scroll">
        <ul class="tree" id="tree" role="tree"></ul>
        <div class="tree-empty" id="treeEmpty" hidden>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          No files match your search.
        </div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <section id="dashboard"><!-- filled by JS --></section>

      <section id="viewer" hidden>
        <div class="viewer-bar">
          <div class="vb-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="addr">
            <span class="adot" id="addrDot"></span>

          + '</div>'
          + '<ul class="children">'+renderTree(node.children, depth+1)+'</ul>'

        var meta = metaFor(node);

  }

  document.getElementById('tree').addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if(!row) return;
    handleRowAction(row);
  });
  document.getElementById('tree').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest('.row');
    if(!row) return;
    e.preventDefault();
    handleRowAction(row);
  });
  function handleRowAction(row){
    var action = row.getAttribute('data-action');
    var path = row.getAttribute('data-path');
    if(action === 'toggle'){
      if(state.expanded.has(path)) state.expanded.delete(path); else state.expanded.add(path);
      paintTree();
    } else if(action === 'open'){
      openFile(path);
    }
  }

  function expandAncestors(path){
    var parts = path.split('/');
    var acc = [];
    for(var i=0;i<parts.length-1;i++){
      acc.push(parts[i]);
      state.expanded.add(acc.join('/'));
    }
  }

  function focusFolder(topName){
    var node = findByTopName(topName);
    if(!node) return;
    state.expanded.add(node.path);
    document.getElementById('search').value = '';
    state.query = '';
    paintTree();
    if(window.matchMedia('(max-width: 880px)').matches) openDrawer();
    requestAnimationFrame(function(){
      var el = document.querySelector('.explorer li.node[data-path="'+CSS.escape(node.path)+'"] > .row');
      if(el){
        el.scrollIntoView({ block:'center', behavior:'smooth' });
        el.style.transition = 'background .3s';
        var prev = el.style.background;
        el.style.background = 'var(--accent-soft-2)';
        setTimeout(function(){ el.style.background = prev; }, 900);
      }
    });
  }

  /* ============ SEARCH ============ */
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function(){
    state.query = searchInput.value;
    paintTree();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== searchInput){
      e.preventDefault();
      searchInput.focus();
    } else if(e.key === 'Escape'){
      if(document.activeElement === searchInput && searchInput.value){
        searchInput.value = ''; state.query=''; paintTree();
      } else if(!document.getElementById('viewer').hidden){
        closeViewer();
      } else if(document.getElementById('explorer').classList.contains('open')){
        closeDrawer();
      }
    }
  });

  /* ============ MOBILE DRAWER ============ */
  var explorerEl = document.getElementById('explorer');
  var scrimEl = document.getElementById('scrim');
  function openDrawer(){
    explorerEl.classList.add('open');
    scrimEl.classList.add('open');
    document.getElementById('menuToggle').setAttribute('aria-expanded','true');
  }
  function closeDrawer(){
    explorerEl.classList.remove('open');
    scrimEl.classList.remove('open');
    document.getElementById('menuToggle').setAttribute('aria-expanded','false');
  }
  document.getElementById('menuToggle').addEventListener('click', function(){
    explorerEl.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  scrimEl.addEventListener('click', closeDrawer);

  /* ============ DASHBOARD ============ */
  function buildDashboard(){
    var totalFiles = ALL_FILES.length;
    var totalDirs = countDirs(MANIFEST);
    var totalBytes = ALL_FILES.reduce(function(a,f){ return a + f.size; }, 0);
    var categories = Object.keys(CATEGORY_META).filter(function(k){ return !!findByTopName(k); });

    var cards = categories.map(function(key){
      var meta = CATEGORY_META[key];
      var node = findByTopName(key);
      var count = countFilesIn(node);
      return '<button class="launch-card" style="--bar:'+meta.accent+'; --tint: color-mix(in oklch, '+meta.accent+' 18%, transparent)" data-focus="'+esc(key)+'">'
        + '<div class="lc-top"><span class="lc-icon">'+ICON.folder+'</span><span class="lc-count">'+count+' file'+(count===1?'':'s')+'</span></div>'
        + '<div class="lc-title">'+esc(meta.title)+'</div>'
        + '<div class="lc-desc">'+esc(meta.desc)+'</div>'
        + '</button>';
    }).join('');

    var legendTypes = ['html','css','js','pdf','md','json'];
    var legend = legendTypes.map(function(t){
      var m = FTYPE_META[t];
      return '<span class="legend-item"><span class="legend-dot" style="background:'+m.color+'"></span>'+m.label+'</span>';
    }).join('') + '<span class="legend-item"><span class="legend-dot" style="background:var(--c-folder)"></span>Folder</span>';

    var creditLink = CONFIG.repoUrl
      ? '<a href="'+esc(CONFIG.repoUrl)+'" target="_blank" rel="noopener">View source on GitHub ↗</a>'
      : '<span></span>';

    document.getElementById('dashboard').innerHTML =
      '<div class="eyebrow">LSS High School · Class 11 &amp; 12</div>'
      + '<h1 class="hero-title">Every lesson file, one click away.</h1>'
      + '<p class="hero-sub">A running archive of HTML, CSS and JavaScript lessons, plus the games and mini-projects built along the way. Pick anything from the tree on the left — it opens right here, or pop it out into its own tab.</p>'
      + '<div class="stat-row">'
        + '<div class="stat-tile"><div class="num">'+totalFiles+'</div><div class="lbl">Files</div></div>'
        + '<div class="stat-tile"><div class="num">'+totalDirs+'</div><div class="lbl">Folders</div></div>'
        + '<div class="stat-tile"><div class="num">'+categories.length+'</div><div class="lbl">Categories</div></div>'
        + '<div class="stat-tile"><div class="num">'+fmtBytes(totalBytes)+'</div><div class="lbl">Archive size</div></div>'
      + '</div>'
      + '<div class="section-label">Jump in</div>'
      + '<div class="card-grid">'+cards+'</div>'
      + '<div class="section-label">File colour key</div>'
      + '<div class="legend">'+legend+'</div>'
      + '<footer class="credit"><span>LSS Learn Code Archive · self-indexing from the repository contents</span>'+creditLink+'</footer>';

    document.querySelectorAll('.launch-card').forEach(function(btn){
      btn.addEventListener('click', function(){ focusFolder(btn.getAttribute('data-focus')); });
    });
  }

  /* ============ VIEWER ============ */
  var dashboardEl = document.getElementById('dashboard');
  var viewerEl = document.getElementById('viewer');
  var viewerBody = document.getElementById('viewerBody');

  function showDashboard(){
    state.active = null;
    viewerEl.hidden = true;
    dashboardEl.hidden = false;
    document.getElementById('breadcrumb').classList.add('is-empty');
    document.getElementById('breadcrumb').innerHTML = '<span class="bpath">no file open — browse the tree on the left</span>';
    document.title = 'LSS Learn — Code Archive';
    paintTree();
    if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function openFile(path){
    var node = state.nodesByPath[path];
    if(!node || node.type !== 'file') return;
    state.active = path;
    expandAncestors(path);
    dashboardEl.hidden = true;
    viewerEl.hidden = false;
    paintTree();
    renderBreadcrumb(node);
    renderViewerBar(node);
    renderViewerBody(node);
    document.title = node.name + ' — LSS Learn';
    var hash = '#/' + encodePath(path);
    if(location.hash !== hash) history.pushState(null, '', hash);
    if(window.matchMedia('(max-width: 880px)').matches) closeDrawer();
  }

  function renderBreadcrumb(node){
    var meta = metaFor(node);
    var bc = document.getElementById('breadcrumb');
    bc.classList.remove('is-empty');
    bc.innerHTML = '<span class="dot" style="background:'+meta.color+'"></span><span class="bpath">'+esc(node.path)+'</span>';
  }

  function renderViewerBar(node){
    var meta = metaFor(node);
    document.getElementById('addrDot').style.background = meta.color;
    document.getElementById('addrPath').textContent = '/' + node.path;
    document.getElementById('addrBytes').textContent = fmtBytes(node.size);
    var href = encodePath(node.path);
    document.getElementById('btnOpenNew').href = href;
    document.getElementById('btnDownload').href = href;
    document.getElementById('btnDownload').setAttribute('download', node.name);
  }

  function renderViewerBody(node){
    var meta = metaFor(node);
    if(node.ftype === 'html'){
      viewerBody.innerHTML = '<iframe class="frame" src="'+encodePath(node.path)+'" title="'+esc(node.name)+' preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox" loading="eager"></iframe>';
      return;
    }
    if(node.ftype === 'pdf'){
      viewerBody.innerHTML = '<iframe class="frame pdf" src="'+encodePath(node.path)+'" title="'+esc(node.name)+'"></iframe>';
      return;
    }
    // text-based preview
    viewerBody.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading '+esc(node.name)+'…</div>';
    fetch(encodePath(node.path)).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(text){
      if(state.active !== node.path) return; // user navigated away
      node._raw = text;
      var html = highlight(text, node.ftype);
      var lines = html.split('\n');
      var rows = lines.map(function(l, i){
        return '<div class="line"><span class="ln">'+(i+1)+'</span><span class="lc">'+(l.length?l:' ')+'</span></div>';
      }).join('');
      viewerBody.innerHTML = '<div class="code-wrap"><div class="code">'+rows+'</div></div>';
    }).catch(function(){
      if(state.active !== node.path) return;
      viewerBody.innerHTML = '<div class="state-msg">'+ICON.warn.replace('width="24" height="24"','width="26" height="26"')+'Couldn\'t load a preview for this file.<br><a class="btn primary" style="margin-top:6px" target="_blank" rel="noopener" href="'+encodePath(node.path)+'">Open directly ↗</a></div>';
    });
  }

  var KEYWORDS = ['const','let','var','function','return','if','else','for','while','do','switch','case','break','continue','class','extends','new','this','import','export','from','default','async','await','try','catch','finally','throw','typeof','instanceof','in','of','null','undefined','true','false','void','yield','static','get','set','super'];
  var KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'g');
  var TOKEN_RE = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)/g;

  function highlightLine(line){
    var out = '', last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while((m = TOKEN_RE.exec(line))){
      out += line.slice(last, m.index).replace(KW_RE, '<span class="tok-k">$1</span>');
      if(m[1] || m[2]) out += '<span class="tok-c">'+m[0]+'</span>';
      else if(m[3]) out += '<span class="tok-s">'+m[0]+'</span>';
      else if(m[4]) out += '<span class="tok-n">'+m[0]+'</span>';
      last = TOKEN_RE.lastIndex;
    }
    out += line.slice(last).replace(KW_RE, '<span class="tok-k">$1</span>');
    return out;
  }

  function highlight(raw, ftype){
    var escaped = esc(raw);
    if(ftype === 'txt') return escaped;
    return escaped.split('\n').map(highlightLine).join('\n');
  }

  function closeViewer(){ showDashboard(); }
  document.getElementById('btnClose').addEventListener('click', closeViewer);
  document.getElementById('brandHome').addEventListener('click', closeViewer);

  document.getElementById('btnCopyPath').addEventListener('click', function(){
    if(!state.active) return;
    var full = location.origin + location.pathname.replace(/\/$/, '') + '/' + encodePath(state.active);
    copyText(full, 'Path copied');
  });

  function copyText(text, label){
    var done = function(){ showToast(label || 'Copied'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    clearTimeout(toastTimer);
    toastEl.innerHTML = ICON.check + '<span>'+esc(msg)+'</span>';
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
  }

  /* ============ DEEP LINKING ============ */
  function pathFromHash(){
    var h = location.hash;
    if(!h.startsWith('#/')) return null;
    try{
      return h.slice(2).split('/').map(decodeURIComponent).join('/');
    }catch(e){ return null; }
  }
  window.addEventListener('popstate', function(){
    var p = pathFromHash();
    if(p && state.nodesByPath[p]) openFile(p); else showDashboard();
  });

  /* ============ INIT ============ */
  buildDashboard();
  paintTree();
  var initialPath = pathFromHash();
  if(initialPath && state.nodesByPath[initialPath]) openFile(initialPath); else showDashboard();

})();
</script>
</body>
